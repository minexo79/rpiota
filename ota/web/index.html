<!doctype html>
<!--
  OTA 更新頁（行為在 app.js）
  Choose File ─> Update ─> PUT /api/upload ─> POST /api/apply
                     輪詢 /api/status ─> log 窗
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Firmware Update</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/pure-min.css">
  <style>
    :root { color-scheme: light; --accent: #0ea5e9; /* 天藍色 */
            --on-accent: #fff; /* 天藍底上的文字 */ }
    body { background: #fff; color: #1f2933; margin: 0; }
    main { max-width: 40rem; margin: 0 auto; padding: 1.5rem 1rem; }
    /* 區塊外框：Pure.css 沒有對應元件，框線顏色沿用 pure-table */
    .panel { margin-bottom: 1rem; padding: 0 1rem 1rem; border: 1px solid #cbcbcb;
             border-radius: 4px; }
    .panel .row { margin-bottom: 0; }
    .info { width: 100%; }
    .info th { width: 1%; white-space: nowrap; text-align: left; }  /* 標題欄縮到剛好 */
    .info td { overflow-wrap: anywhere; }
    /* 進度條疊兩層同樣的文字：底層深字，上層天藍底白字依百分比裁切 */
    .bar { --percent: 0; position: relative; height: 2.2rem; margin: 1.25rem 0;
           overflow: hidden; border: 1px solid #ccc; border-radius: 1.2rem;
           background: #fafafa; }
    .bar span { position: absolute; inset: 0; line-height: 2.2rem; text-align: center;
                white-space: nowrap; }
    .bar .fill { background: var(--accent); color: var(--on-accent);
                 clip-path: inset(0 calc(100% - var(--percent) * 1%) 0 0); }
    .row { display: flex; align-items: center; gap: 1rem; margin-bottom: 1.25rem; }
    .button-accent { flex: none; width: 8.5rem; background: var(--accent);
                     color: var(--on-accent); font-size: 1.05rem; }
    #filename { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis;
                white-space: nowrap; }
    .logbox { border: 1px solid #ccc; background: #fafafa; }
    .logbox summary { padding: .5rem .75rem; cursor: pointer; }  /* 只顯示收合箭頭 */
    #log { box-sizing: border-box; height: 17rem; overflow-y: auto; margin: 0;
           padding: 0 .75rem .75rem; font-size: .85rem; white-space: pre-wrap;
           overflow-wrap: anywhere; }
    footer { text-align: center; }
    footer a { display: inline-block; color: #6b7280; }
    footer a:hover { color: #1f2933; }
    @media (max-width: 30rem) {
      .row { gap: .5rem; }
      .panel { padding: 0 .75rem .75rem; }
      .button-accent { width: 6rem; padding-left: 0; padding-right: 0; font-size: .95rem; }
    }
  </style>
  <script src="/app.js" defer></script>
</head>
<body>
<main>
  <section class="panel">
    <h4>Information</h4>
    <table class="pure-table pure-table-horizontal info">
      <tbody>
        <tr><th scope="row">Board</th><td id="board">—</td></tr>
        <tr><th scope="row">CPU</th><td id="cpu">—</td></tr>
        <tr><th scope="row">GPU</th><td id="gpu">—</td></tr>
        <tr><th scope="row">RAM</th><td id="ram">—</td></tr>
        <tr><th scope="row">Device Name</th><td id="device">—</td></tr>
        <tr><th scope="row">Version</th><td id="version">—</td></tr>
      </tbody>
    </table>
  </section>
  <section class="panel">
    <h4>Upgrade</h4>
    <div class="bar" id="progress" role="progressbar" aria-label="Progress"
         aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <span id="progress-text">Connecting...</span>
      <span class="fill" id="progress-fill" aria-hidden="true">Connecting...</span>
    </div>
    <div class="row">
      <input type="file" id="file" accept=".ota" hidden>
      <button type="button" class="pure-button button-accent" id="choose">Choose File</button>
      <span id="filename">No file chosen</span>
      <button type="button" class="pure-button button-accent" id="update" disabled>Update</button>
    </div>
  </section>
  <section class="panel">
    <h4>Log</h4>
    <details class="logbox" id="logbox">
      <summary aria-label="Show or hide messages"></summary>
      <pre id="log" role="log" aria-label="Messages" tabindex="0"></pre>
    </details>
  </section>
  <footer>
    <a href="https://github.com/minexo79/rpiota" target="_blank" rel="noopener noreferrer"
       aria-label="GitHub: minexo79/rpiota" title="github.com/minexo79/rpiota">
      <svg viewBox="0 0 16 16" width="24" height="24" fill="currentColor" aria-hidden="true">
        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/>
      </svg>
    </a>
  </footer>
</main>
</body>
</html>
